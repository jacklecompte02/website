name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # If your branch is called master, change "main" to "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './html' # This forces GitHub to use your html folder as the root homepage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
